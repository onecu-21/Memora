name: Build and release Memora

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag (must match vX.Y.Z exactly)
        required: true
        type: string

permissions:
  contents: write

# Serializing the whole pipeline prevents two main pushes from selecting the same
# alpha number. A newer run waits rather than cancelling a partially built release.
concurrency:
  group: memora-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.24.5

jobs:
  prepare:
    name: Select and validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            latest="$({ git tag --list 'alpha-[0-9]*' || true; } \
              | sed -nE 's/^alpha-([0-9]+)$/\1/p' \
              | sort -n \
              | tail -n 1)"
            next=$(( ${latest:-0} + 1 ))
            tag="alpha-$next"
            prerelease=true
          else
            tag="$REQUESTED_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Stable release tags must match vX.Y.Z exactly." >&2
              exit 1
            fi
            prerelease=false
          fi

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Release tag $tag already exists." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Selected $tag (prerelease=$prerelease)"

  android:
    name: Build Android
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Complete Android runner
        run: flutter create --platforms=android --org app.memora .
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Name Android artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk memora-${{ needs.prepare.outputs.tag }}-android.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: memora-android
          path: memora-${{ needs.prepare.outputs.tag }}-android.apk
          if-no-files-found: error

  linux:
    name: Build Linux
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Complete Linux runner
        run: flutter create --platforms=linux --org app.memora .
      - name: Resolve packages
        run: flutter pub get
      - name: Build Linux bundle
        run: flutter build linux --release
      - name: Package Linux bundle
        run: tar -C build/linux/x64/release/bundle -czf memora-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz .
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: memora-linux
          path: memora-${{ needs.prepare.outputs.tag }}-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Complete Windows runner
        run: flutter create --platforms=windows --org app.memora .
      - name: Resolve packages
        run: flutter pub get
      - name: Build Windows bundle
        run: flutter build windows --release
      - name: Package Windows bundle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath memora-${{ needs.prepare.outputs.tag }}-windows-x64.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: memora-windows
          path: memora-${{ needs.prepare.outputs.tag }}-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=("$TAG" release-artifacts/* --repo "$REPOSITORY" --target "$TARGET_SHA" --generate-notes --title "Memora $TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
